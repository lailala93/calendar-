<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Calendar</title>
  </head>
  <body class="dark-mode">
    <div class="app-shell">
      <div class="themeToggle">
        <button id="moon" class="themeToggle__moon">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="sun" class="themeToggle__sun">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
      <header>
        <div class="prev" id="prevBtn">
          <i class="fa-solid fa-chevron-left"></i>
        </div>

        <div class="current">
          <span class="month" id="month">Current Month </span>
          <span class="bnyu">
            <img
              src="./images/bunny_icon.png"
              alt="A bunny icon"
              id="bunnyIcon"
            />
          </span>
          <span class="year" id="year">Current year</span>
        </div>

        <div class="next" id="nextBtn">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </header>

      <main>
        <!-- Agenda items -->
        <div class="agenda" id="agenda">
          <!-- ~Date of the planenr top right~ -->
          <p class="note__date currentDate"></p>

          <h2 class="title-style">Agenda</h2>

          <ul id="agenda__list" class="agenda__list"></ul>
          <!-- NOTES -->
          <div id="note" class="note">
            <span class="note__close" id="close-note"> &#10006; </span>

            <h2 class="title-style" id="note--title">Add a note</h2>

            <div class="note__editor">
              <textarea
                class="note__textarea"
                id="noteTextarea"
                placeholder="Insert notes"
              ></textarea>

              <!-- <div class="button-wrapper"> -->
              <button type="button" class="note__add" id="saveNote">
                <i class="fa-solid fa-plus"></i>
              </button>
              <!-- </div> -->
            </div>
          </div>
          <!-- END notes -->
        </div>
        <!-- end agenda -->

        <!-- Calendar -->
        <div class="calendar">
          <div class="weekdays" id="week"></div>
          <div class="rows" id="rows"></div>
        </div>
        <!-- end calendar | start js NOTE -->
      </main>
    </div>
    <script type="module" src="./src/index.js"></script>
  </body>
</html>
